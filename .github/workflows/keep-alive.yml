name: PulseChat 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (Render sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PulseChat Cloud Server
        run: |
          echo "Sending keep-alive ping to PulseChat on Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 30 "https://pulse-chat-qel7.onrender.com/api/health")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" = "200" ]; then
            echo "Server is healthy and awake! (HTTP 200)"
          else
            echo "Server responded with status $STATUS"
          fi
