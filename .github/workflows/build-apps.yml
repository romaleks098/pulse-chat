name: Build Native Apps (Android APK & Windows EXE)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install

      - name: Build Web Client & Sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PulseChat-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseChat-Android-APK
          path: PulseChat-Android.apk
          retention-days: 14

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd client
          npm install
          cd ../desktop
          npm install

      - name: Build Client Web Assets
        run: |
          cd client
          npm run build

      - name: Copy Client Dist to Desktop
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path desktop/client_dist
          Copy-Item -Path client/dist/* -Destination desktop/client_dist -Recurse -Force

      - name: Build Electron Executable (NSIS & Portable)
        run: |
          cd desktop
          npm run build:exe

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseChat-Windows-EXE
          path: desktop/release/*.exe
          retention-days: 14

  release-apps:
    name: Publish Release with Native Binaries
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PulseChat-Android-APK
          path: release-binaries/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: PulseChat-Windows-EXE
          path: release-binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PulseChat ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          files: release-binaries/*
          draft: false
          prerelease: false
          body: |
            ## PulseChat Release ${{ github.ref_name }} ⚡
            
            ### Native Applications Available for Download:
            - **Android:** `PulseChat-Android.apk`
            - **Windows Desktop:** `PulseChat-Setup.exe` (Installer) and `PulseChat-Portable.exe`
            
            #### Highlights:
            - True standalone offline-capable native client
            - Telegram-style custom titlebar for Windows
            - Real-time mobile responsive layout (< 768px fixes)
            - Seamless native OAuth login with Deep Links (`pulsechat://auth/callback`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
