name: Build Android APK & Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install

      - name: Build Web Client & Sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseChat-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest-apk
          name: PulseChat Android APK (Release)
          body: "Готовый установочный файл PulseChat для Android смартфонов."
